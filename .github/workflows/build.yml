name: Build Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 内核测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm test

  windows:
    name: Windows 安装包
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 安装桌面打包依赖
        working-directory: desktop
        run: npm ci

      - name: 生成 NSIS 安装包
        run: python scripts/build-exe.py

      - name: 冒烟自检（打包后的运行时）
        shell: pwsh
        run: |
          $env:HD_SMOKE = '1'
          $env:HD_SMOKE_DIR = Join-Path $env:GITHUB_WORKSPACE '.shots'
          New-Item -ItemType Directory -Force -Path $env:HD_SMOKE_DIR | Out-Null
          $exe = Get-ChildItem -Path 'release\desktop\win-unpacked\*.exe' |
                 Where-Object { $_.Name -notmatch 'Setup|uninstall' } | Select-Object -First 1
          Write-Host "运行 $($exe.FullName)"
          & $exe.FullName
          # GUI 进程不会阻塞 PowerShell：应用启动+自检约需 5-10s 才写出结果文件，
          # 必须轮询等待，不能启动后立刻检查（run #20 即因此误报失败）
          $resultPath = Join-Path $env:HD_SMOKE_DIR 'smoke-result.json'
          $deadline = (Get-Date).AddMinutes(4)
          while (-not (Test-Path -LiteralPath $resultPath)) {
            if ((Get-Date) -gt $deadline) { throw "冒烟自检超时：$resultPath 未产出" }
            Start-Sleep -Milliseconds 500
          }
          Start-Sleep -Milliseconds 500
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          Write-Host "自检 $($result.passed)/$($result.total) 通过"
          if (-not $result.ok) { throw "冒烟自检未通过：$($result.failed -join ', ')" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/desktop/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-shots
          path: .shots/
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装前端依赖并构建
        run: |
          npm ci
          npm run build

      - name: 准备 Android SDK 组件
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: 构建 APK
        run: python3 scripts/build-apk.py

      - name: 校验 APK 签名与内容
        run: |
          SDK="${ANDROID_HOME}"
          APK=$(ls release/android/*.apk | head -1)
          "$SDK/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -E "classes.dex|assets/www/index.html"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/android/*.apk
          if-no-files-found: error

  release:
    name: 附加产物到 Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 列出产物
        run: find artifacts -type f \( -name '*.exe' -o -name '*.apk' \) -exec ls -lh {} \;

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.apk
          fail_on_unmatched_files: true
